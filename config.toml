title: "Quiet Reference Site"
description: "A quiet place for thoughtful references and poetry"
author: "vodkashot"
url: "https://github.com/Vodkashot28/quiet-reference-site"

collections:
  fragments:
    output: true
  poems:
    output: true
  letters:
    output: true

defaults:
  - scope:
      path: ""
      type: "fragments"
    values:
      layout: "fragment"
  - scope:
      path: ""
      type: "poems"
    values:
      layout: "poem"
  - scope:
      path: ""
      type: "letters"
    values:
      layout: "letter"
