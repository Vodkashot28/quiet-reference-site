<div class="poem-actions">
  <button class="action-btn" id="btn-tts" aria-label="Read aloud">▶ Listen</button>
  <button class="action-btn" id="btn-watch" aria-label="Watch cinematic poem">◈ Watch</button>
  <button class="action-btn" id="btn-save-img" aria-label="Save as image">⬇ Save as Image</button>
  <button class="action-btn" id="btn-copy" aria-label="Copy link">🔗 Copy link</button>
  <a class="action-btn" id="btn-twitter" href="#" target="_blank" rel="noopener" aria-label="Share on Twitter">𝕏 Share</a>
  {% if page.native_share %}<button class="action-btn" id="btn-share" aria-label="Share">↗ Share</button>{% endif %}
</div>
