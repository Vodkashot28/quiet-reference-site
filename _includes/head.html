<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta name="keywords" content="{{ page.keywords | default: 'poetry, fragments, letters, quiet reference, emotional clarity, truth, restraint, healing, boundaries, self-worth' }}" />
<meta name="author" content="Quiet Reference" />

<!-- Canonical -->
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- Open Graph -->
<meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<!-- og:image and twitter:card emitted by social-card.html -->

<!-- Provenance -->
{% if site.ipfs_cid %}<meta name="ipfs-cid" content="{{ site.ipfs_cid }}" />{% endif %}
{% if site.git_hash %}<meta name="git-hash" content="{{ site.git_hash }}" />{% endif %}

<!-- Favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ page.root | default: '' }}assets/favicon/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ page.root | default: '' }}assets/favicon/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="{{ page.root | default: '' }}assets/favicon/favicon-16x16.png" />
<link rel="manifest" href="{{ page.root | default: '' }}assets/favicon/site.webmanifest" />

<!-- Preload stylesheet -->
<link rel="preload" href="{{ page.root | default: '' }}style.css" as="style" />
<link rel="stylesheet" href="{{ page.root | default: '' }}style.css" />

<title>{{ page.title | default: site.title }}</title>
