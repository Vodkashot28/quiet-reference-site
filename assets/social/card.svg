---
---
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img"
     aria-label="{{ page.poem_title | default: page.title | default: site.title }}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="87"  cy="43"  r="1.2"/><circle cx="213" cy="118" r="0.8"/>
    <circle cx="340" cy="29"  r="1.0"/><circle cx="456" cy="87"  r="1.4"/>
    <circle cx="578" cy="55"  r="0.7"/><circle cx="701" cy="132" r="1.1"/>
    <circle cx="823" cy="19"  r="0.9"/><circle cx="944" cy="74"  r="1.3"/>
    <circle cx="1067" cy="48" r="0.8"/><circle cx="1150" cy="110" r="1.0"/>
    <circle cx="132" cy="210" r="0.7"/><circle cx="267" cy="195" r="1.2"/>
    <circle cx="389" cy="240" r="0.9"/><circle cx="512" cy="178" r="1.1"/>
    <circle cx="634" cy="222" r="0.8"/><circle cx="756" cy="190" r="1.3"/>
    <circle cx="878" cy="235" r="0.7"/><circle cx="1001" cy="205" r="1.0"/>
    <circle cx="1123" cy="218" r="1.2"/><circle cx="55"  cy="310" r="0.9"/>
    <circle cx="178" cy="345" r="1.1"/><circle cx="301" cy="298" r="0.8"/>
    <circle cx="423" cy="360" r="1.4"/><circle cx="545" cy="315" r="0.7"/>
    <circle cx="667" cy="350" r="1.0"/><circle cx="789" cy="305" r="1.2"/>
    <circle cx="912" cy="340" r="0.9"/><circle cx="1034" cy="320" r="1.1"/>
    <circle cx="1156" cy="355" r="0.8"/><circle cx="98"  cy="450" r="1.0"/>
    <circle cx="221" cy="480" r="0.7"/><circle cx="344" cy="435" r="1.3"/>
    <circle cx="466" cy="495" r="0.9"/><circle cx="588" cy="460" r="1.1"/>
    <circle cx="710" cy="490" r="0.8"/><circle cx="833" cy="445" r="1.2"/>
    <circle cx="955" cy="475" r="0.7"/><circle cx="1078" cy="455" r="1.0"/>
    <circle cx="1170" cy="488" r="1.3"/>
  </g>
  <g fill="#c8d8f0" opacity="0.9">
    <circle cx="193" cy="67"  r="1.8"/><circle cx="621" cy="142" r="2.0"/>
    <circle cx="987" cy="88"  r="1.6"/><circle cx="412" cy="390" r="1.9"/>
    <circle cx="834" cy="270" r="1.7"/><circle cx="256" cy="530" r="2.1"/>
    <circle cx="730" cy="580" r="1.6"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Site name -->
  <text x="600" y="72"
        font-family="Georgia, serif" font-size="18" letter-spacing="8"
        fill="#8aaccc" text-anchor="middle" opacity="0.8">QUIET REFERENCE</text>

  <!-- Divider -->
  <line x1="500" y1="90" x2="700" y2="90" stroke="#8aaccc" stroke-width="0.7" opacity="0.35"/>

  <!-- Title -->
  {% assign title = page.poem_title | default: page.title | default: site.title %}
  <text x="600" y="200"
        font-family="Georgia, serif" font-size="52" font-weight="bold"
        fill="#f0ece4" text-anchor="middle" dominant-baseline="middle">
    {{ title | truncate: 40 }}
  </text>

  <!-- Description / excerpt -->
  {% assign desc = page.description | default: site.description %}
  <text x="600" y="290"
        font-family="Georgia, serif" font-size="26" font-style="italic"
        fill="#c8bfb0" text-anchor="middle" dominant-baseline="middle" opacity="0.9">
    {{ desc | truncate: 80 }}
  </text>

  <!-- Divider -->
  <line x1="440" y1="340" x2="760" y2="340" stroke="#c49a6c" stroke-width="0.8" opacity="0.4"/>

  <!-- URL -->
  <text x="600" y="390"
        font-family="Georgia, serif" font-size="20" letter-spacing="2"
        fill="#8aaccc" text-anchor="middle" opacity="0.75">quietreference.xyz</text>

  <!-- CID provenance bar -->
  {% assign cid = page.provenance_cid | default: site.ipfs_cid %}
  {% if cid %}
  <rect x="0" y="580" width="1200" height="50" fill="#0a0a14" opacity="0.85"/>
  <text x="24" y="611"
        font-family="monospace" font-size="14"
        fill="#4a5568" dominant-baseline="middle" opacity="0.9">IPFS</text>
  <text x="72" y="611"
        font-family="monospace" font-size="14"
        fill="#8aaccc" dominant-baseline="middle" opacity="0.85">{{ cid }}</text>
  {% if site.git_hash and site.git_hash != '' %}
  <text x="1176" y="611"
        font-family="monospace" font-size="14"
        fill="#4a5568" text-anchor="end" dominant-baseline="middle" opacity="0.9">
    git:{{ site.git_hash | truncate: 10, '' }}
  </text>
  {% endif %}
  {% endif %}
</svg>
