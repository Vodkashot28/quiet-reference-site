---
---
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img"
     aria-label="{{ page.poem_title | default: page.title | default: site.title }}">
  <defs>
    <!-- Deep background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Starfield — fixed seed so it's deterministic across builds -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="87"  cy="43"  r="1.2"/><circle cx="213" cy="118" r="0.8"/>
    <circle cx="340" cy="29"  r="1.0"/><circle cx="456" cy="87"  r="1.4"/>
    <circle cx="578" cy="55"  r="0.7"/><circle cx="701" cy="132" r="1.1"/>
    <circle cx="823" cy="19"  r="0.9"/><circle cx="944" cy="74"  r="1.3"/>
    <circle cx="1067" cy="48" r="0.8"/><circle cx="1150" cy="110" r="1.0"/>
    <circle cx="132" cy="210" r="0.7"/><circle cx="267" cy="195" r="1.2"/>
    <circle cx="389" cy="240" r="0.9"/><circle cx="512" cy="178" r="1.1"/>
    <circle cx="634" cy="222" r="0.8"/><circle cx="756" cy="190" r="1.3"/>
    <circle cx="878" cy="235" r="0.7"/><circle cx="1001" cy="205" r="1.0"/>
    <circle cx="1123" cy="218" r="1.2"/><circle cx="55"  cy="310" r="0.9"/>
    <circle cx="178" cy="345" r="1.1"/><circle cx="301" cy="298" r="0.8"/>
    <circle cx="423" cy="360" r="1.4"/><circle cx="545" cy="315" r="0.7"/>
    <circle cx="667" cy="350" r="1.0"/><circle cx="789" cy="305" r="1.2"/>
    <circle cx="912" cy="340" r="0.9"/><circle cx="1034" cy="320" r="1.1"/>
    <circle cx="1156" cy="355" r="0.8"/><circle cx="98"  cy="450" r="1.0"/>
    <circle cx="221" cy="480" r="0.7"/><circle cx="344" cy="435" r="1.3"/>
    <circle cx="466" cy="495" r="0.9"/><circle cx="588" cy="460" r="1.1"/>
    <circle cx="710" cy="490" r="0.8"/><circle cx="833" cy="445" r="1.2"/>
    <circle cx="955" cy="475" r="0.7"/><circle cx="1078" cy="455" r="1.0"/>
    <circle cx="1170" cy="488" r="1.3"/><circle cx="42"  cy="570" r="0.8"/>
    <circle cx="165" cy="595" r="1.1"/><circle cx="288" cy="560" r="0.9"/>
    <circle cx="410" cy="610" r="0.7"/><circle cx="532" cy="575" r="1.2"/>
    <circle cx="654" cy="605" r="1.0"/><circle cx="776" cy="568" r="0.8"/>
    <circle cx="899" cy="590" r="1.3"/><circle cx="1021" cy="578" r="0.9"/>
    <circle cx="1143" cy="600" r="1.1"/>
  </g>

  <!-- Brighter accent stars -->
  <g fill="#c8d8f0" opacity="0.9">
    <circle cx="193" cy="67"  r="1.8"/><circle cx="621" cy="142" r="2.0"/>
    <circle cx="987" cy="88"  r="1.6"/><circle cx="412" cy="390" r="1.9"/>
    <circle cx="834" cy="270" r="1.7"/><circle cx="1089" cy="520" r="1.8"/>
    <circle cx="256" cy="530" r="2.1"/><circle cx="730" cy="580" r="1.6"/>
  </g>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Site name -->
  <text x="600" y="88"
        font-family="Georgia, serif" font-size="22" letter-spacing="6"
        fill="#8aaccc" text-anchor="middle" opacity="0.85">
    QUIET REFERENCE
  </text>

  <!-- Divider -->
  <line x1="480" y1="108" x2="720" y2="108" stroke="#8aaccc" stroke-width="0.8" opacity="0.4"/>

  <!-- Poem excerpt — up to two lines, centred -->
  {% assign excerpt = page.excerpt | default: page.description | default: site.description %}
  {% assign excerpt_lines = excerpt | split: "\n" %}
  {% if excerpt_lines.size > 1 %}
    <text x="600" y="290"
          font-family="Georgia, serif" font-size="42" font-style="italic"
          fill="#f0ece4" text-anchor="middle" dominant-baseline="middle">
      {{ excerpt_lines[0] | strip }}
    </text>
    <text x="600" y="348"
          font-family="Georgia, serif" font-size="42" font-style="italic"
          fill="#f0ece4" text-anchor="middle" dominant-baseline="middle">
      {{ excerpt_lines[1] | strip }}
    </text>
  {% else %}
    <text x="600" y="318"
          font-family="Georgia, serif" font-size="42" font-style="italic"
          fill="#f0ece4" text-anchor="middle" dominant-baseline="middle">
      {{ excerpt | truncate: 72 }}
    </text>
  {% endif %}

  <!-- Listen cue pill -->
  <rect x="490" y="415" width="220" height="46" rx="23"
        fill="none" stroke="#c49a6c" stroke-width="1.5" opacity="0.8"/>
  <text x="600" y="444"
        font-family="Georgia, serif" font-size="20"
        fill="#c49a6c" text-anchor="middle" dominant-baseline="middle" opacity="0.9">
    🔊 Listen at quietreference.xyz
  </text>

  <!-- CID provenance footer -->
  {% assign cid = page.provenance_cid | default: site.ipfs_cid %}
  {% if cid %}
  <text x="600" y="590"
        font-family="monospace" font-size="13"
        fill="#666e88" text-anchor="middle" opacity="0.7">
    ipfs://{{ cid }}
  </text>
  {% endif %}
</svg>
