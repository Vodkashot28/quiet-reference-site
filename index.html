<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Reference</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f6f2;
      font-family: 'Georgia', serif;
      color: #2e2e2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .hero {
      max-width: 800px;
      padding: 2rem;
    }

    img {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      transition: opacity 1.5s ease;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h1 {
      font-size: 2.5rem;
      color: #3a4a5a;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      color: #555;
      max-width: 600px;
      margin: auto;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #888;
    }

    a {
      color: #3a4a5a;
      text-decoration: none;
    }

    a:hover {
      color: #a67c52;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="image.png" alt="Quiet Reference Cover" />
