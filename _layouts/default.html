<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  {% include social-card.html %}
  {{ page.head_extra }}
</head>
<body>
  {% include nav.html %}
  <main id="main-content" role="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "publisher": { "@type": "Organization", "name": "{{ site.title }}" },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ site.url }}/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {% if page.schema %}
  <script type="application/ld+json">{{ page.schema }}</script>
  {% endif %}
  <script src="{{ page.root | default: '' }}static/js/theme.js"></script>
</body>
</html>
